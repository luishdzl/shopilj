# Docker Compose para entorno local completo
# 
# Servicios:
#   - postgres: Base de datos PostgreSQL
#   - redis: Colas y caché
#   - python-backend: FastAPI backend (integraciones)
#   - nextjs-storefront: Storefront Next.js + Tailwind
#   - shopify-theme: Shopify CLI theme dev

version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: natulim-postgres
    environment:
      POSTGRES_DB: natulim
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: natulim-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  python-backend:
    build:
      context: ./backend-integrations
      dockerfile: Dockerfile
    container_name: natulim-backend
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    volumes:
      - ./backend-integrations:/app
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    env_file:
      - .env

  nextjs-storefront:
    build:
      context: ./storefront
      dockerfile: Dockerfile
    container_name: natulim-storefront
    command: npm run dev
    volumes:
      - ./storefront:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - python-backend

  shopify-theme:
    image: node:20-alpine
    container_name: natulim-theme
    working_dir: /theme
    command: npx shopify theme dev --store ${SHOPIFY_STORE} --password ${SHOPIFY_THEME_PASSWORD} --host 0.0.0.0
    volumes:
      - ./theme:/theme
    ports:
      - "9292:9292"
    env_file:
      - .env
    # Requiere tienda de desarrollo Shopify (partner) y theme password

volumes:
  postgres_data:
  redis_data: