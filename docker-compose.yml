# Docker Compose — rama "main" (SIN base de datos, SIN Redis)
# Todo el estado se guarda en archivos JSON.
#
# Uso:
#   docker compose up
#
# Servicios:
#   - python-backend: FastAPI que lee/escribe JSON (sin DB)
#   - nextjs-storefront: Storefront Next.js (consume JSON local)

version: '3.8'

services:
  python-backend:
    build:
      context: ./backend-integrations
      dockerfile: Dockerfile
    container_name: natulim-backend
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    volumes:
      - ./backend-integrations:/app
    ports:
      - "8000:8000"
    environment:
      - JSON_STORE_DIR=/app/data
      - SHOPIFY_WEBHOOK_SECRET=${SHOPIFY_WEBHOOK_SECRET:-}

  nextjs-storefront:
    image: node:20-alpine
    container_name: natulim-storefront
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./storefront:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_DATA_SOURCE=json
    depends_on:
      - python-backend